# Parser preference per content type, highest priority first.
#
# Read by harness.indexing.parser_preference.load_parser_preference. For each URL
# the build (harness.indexing.ingest.iter_source_rows) keeps one clean row of Mongo
# `parsed_documents`: the row that matches the earliest entry below, and among rows
# that match the same entry, the one with the newest `parsed_at`.
#
# An entry `name` matches every version of that parser. An entry `name@version`
# matches that version only (decision D, docs/pm/decisions/2026-11-25_legacy-parser-name.md).
# `pymupdf4llm@legacy` names the 58,121 PDF rows the graph was embedded from; it
# comes first, so a new PDF parse does not replace their text (decision A,
# docs/pm/decisions/2026-11-25_pdf-parser-order.md). A URL whose rows match no
# entry falls back to its newest clean row, with a warning (decision F).
#
# Authored data: edited by hand, read by code, written by no tool.

application/pdf:
  - pymupdf4llm@legacy
  - pymupdf4llm
text/html:
  - trafilatura
